<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คสถานะ - ก้องล้อซิ่ง ชลบุรี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-main text-white">
    <header id="global-header"></header>

    <main class="container mx-auto px-4 py-16 text-center">
        <h1 class="text-3xl font-bold mb-4">เช็คสถานะคิว</h1>
        <p class="text-gray-400 mb-8 mt-2">กรอกเบอร์โทรศัพท์ที่ใช้ตอนจอง เพื่อดูสถานะคิวของคุณ</p>

        <form id="track-form" class="max-w-md mx-auto mb-8 relative">
            <input type="tel" id="t-phone" required class="w-full px-4 py-3 rounded-lg text-lg text-center" placeholder="เบอร์โทรศัพท์ 08x-xxx-xxxx">
            <button type="submit" class="w-full btn-outline mt-4 text-lg py-2">ค้นหาคิว</button>
        </form>

        <div id="track-results" class="max-w-md mx-auto hidden text-left mt-8">
            <!-- Results list -->
        </div>
    </main>

    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
