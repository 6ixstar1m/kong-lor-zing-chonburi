<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองคิวรถ - ก้องล้อซิ่ง ชลบุรี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-main text-white">
    <header id="global-header"></header>

    <main class="container mx-auto px-4 py-12">
        <div class="max-w-xl mx-auto">
            <h1 class="text-3xl font-bold text-center mb-6 border-b border-red-900 pb-4">จองคิวทำรถ</h1>

            <div id="booking-success"
                class="hidden bg-green-900/50 border border-green-500 rounded p-6 mb-8 text-center">
                <h2 class="text-2xl font-bold text-green-400 mb-2">✅ จองคิวสำเร็จ!</h2>
                <p>รหัสคิวของคุณคือ: <span id="booking-success-ref"
                        class="font-mono font-bold bg-green-800 px-2 py-1 rounded"></span></p>
                <p class="text-sm mt-2 text-gray-300">กำลังพาไปหน้าเช็คสถานะ...</p>
            </div>

            <form id="booking-form" class="bg-[#111] p-6 rounded-lg border border-gray-800 space-y-6">
                <!-- 1 -->
                <div>
                    <label class="block text-gray-400 mb-1">ชื่อ - นามสกุล</label>
                    <input type="text" name="name" required class="w-full px-4 py-2 rounded"
                        placeholder="เช่น ก้อง สายซิ่ง">
                </div>
                <!-- 2 -->
                <div>
                    <label class="block text-gray-400 mb-1">เบอร์โทรศัพท์ (สำคัญมาก)</label>
                    <input type="tel" name="phone" required class="w-full px-4 py-2 rounded" placeholder="08xxxxxxxx">
                </div>
                <!-- 3 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">รถรุ่นอะไร / ปีอะไร</label>
                        <input type="text" name="car_model" required class="w-full px-4 py-2 rounded"
                            placeholder="เช่น Honda Civic 2018">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">ป้ายทะเบียนรถ</label>
                        <input type="text" name="license_plate" required class="w-full px-4 py-2 rounded"
                            placeholder="ฮฮ 1234 ชลบุรี">
                    </div>

                </div>
                <!-- 4 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">ต้องการทำอะไร</label>
                        <select name="service" required class="w-full px-4 py-2 rounded appearance-none">
                            <option value="">-- เลือกบริการ --</option>
                            <option value="ล้อแม็ก & ยาง (มือหนึ่ง–มือสอง)">ล้อแม็ก & ยาง (มือหนึ่ง–มือสอง)</option>
                            <option value="ซ่อมโช้คจัดทรง / ย้ายแหนบซ่อมช่วงล่าง">ซ่อมโช้คจัดทรง / ย้ายแหนบซ่อมช่วงล่าง
                            </option>
                            <option value="เซอร์วิสเต็มระบบ">เซอร์วิสเต็มระบบ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">เลือกสาขา</label>
                        <select id="branch-select" name="branch" required
                            class="w-full px-4 py-2 rounded appearance-none">
                            <option value="">-- เลือกสาขา --</option>
                        </select>
                    </div>
                </div>
                <!-- 5 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1">วันที่</label>
                        <input type="date" id="b-date" name="date" required class="w-full px-4 py-2 rounded">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">เวลา (08:00 - 20:00)</label>
                        <input type="time" name="time" min="08:00" max="20:00" required
                            class="w-full px-4 py-2 rounded">
                    </div>

                    </div>

                </div>

                <!-- 6 -->
                <div>
                    <label class="block text-gray-400 mb-1">ความต้องการ / หมายเหตุเพิ่มเติม (ถ้ามี)</label>
                    <input type="text" name="note" class="w-full px-4 py-2 rounded" placeholder="ระบุสิ่งที่ต้องการหรืออาการรถเพิ่มเติมให้ช่างทราบ...">
                </div>

                <div class="pt-4 border-t border-gray-800 mt-4">
                    <button type="submit" class="w-full btn-primary py-3 text-lg">บันทึกการจอง</button>
                </div>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
